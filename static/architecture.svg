<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" fill="none">
  <defs>
    <linearGradient id="background" x1="70" y1="30" x2="1370" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="pi" x1="520" y1="238" x2="918" y2="612" gradientUnits="userSpaceOnUse">
      <stop stop-color="#202D42"/>
      <stop offset="1" stop-color="#182334"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".28"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1L8 5L1 9" stroke="#57A6FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1L8 5L1 9" stroke="#FFC857" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1L8 5L1 9" stroke="#55D6A2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1L8 5L1 9" stroke="#B49AFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-control" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1L8 5L1 9" stroke="#FF9678" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .title{fill:#F4F7FC;font-size:30px;font-weight:700;letter-spacing:-.5px}
      .subtitle{fill:#98A8BD;font-size:15px}
      .card{fill:#151F2E;stroke:#2B3A4F;stroke-width:1.4}
      .card-title{fill:#F1F5FB;font-size:17px;font-weight:650}
      .card-detail{fill:#A6B4C7;font-size:13px}
      .badge{font-size:11px;font-weight:650;letter-spacing:.5px}
      .label{fill:#BAC8DA;font-size:12px;font-weight:550}
      .small{fill:#8FA0B6;font-size:11px}
    </style>
  </defs>

  <rect width="1440" height="820" rx="24" fill="url(#background)"/>
  <circle cx="1230" cy="90" r="220" fill="#243B67" opacity=".14"/>
  <circle cx="145" cy="705" r="200" fill="#1D6A62" opacity=".10"/>

  <text class="title" x="64" y="72">Energy, from meter to dashboard</text>
  <text class="subtitle" x="64" y="101">Local readings, EV charging control, BMW CarData, and a dashboard hosted on the Raspberry Pi</text>
  <rect x="1195" y="49" width="181" height="32" rx="16" fill="#1C2A3D" stroke="#34465E"/>
  <circle cx="1214" cy="65" r="5" fill="#55D6A2"/>
  <text x="1227" y="69" fill="#C5D2E2" font-size="11" font-weight="600">HOME NETWORK + CLOUD</text>

  <!-- Device-to-Pi data flows -->
  <path d="M376 225C430 225 444 297 520 297" stroke="#57A6FF" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <path d="M376 406H520" stroke="#FFC857" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-amber)"/>
  <path d="M376 587C430 587 444 507 520 507" stroke="#55D6A2" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <path d="M552 560H480V674H398Q388 674 388 664V649H376" stroke="#FF9678" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-control)"/>
  <path d="M1005 218C956 218 970 288 920 288" stroke="#B49AFF" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-violet)"/>
  <path d="M920 491C954 491 966 497 1005 497" stroke="#57A6FF" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-blue)"/>

  <!-- Local devices -->
  <g filter="url(#shadow)">
    <rect class="card" x="64" y="163" width="312" height="124" rx="16"/>
    <rect x="82" y="181" width="52" height="52" rx="14" fill="#153354"/>
    <path d="M108 190C101 200 95 207 95 214a13 13 0 0 0 26 0c0-7-6-14-13-24Z" stroke="#57A6FF" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M101 216c1 4 4 6 8 7" stroke="#57A6FF" stroke-width="2" stroke-linecap="round"/>
    <text class="card-title" x="150" y="199">HomeWizard P1</text>
    <text class="card-detail" x="150" y="220">Grid import · export · water</text>
    <rect x="150" y="237" width="125" height="24" rx="12" fill="#17304B"/>
    <text class="badge" x="163" y="253" fill="#83BEFF">LOCAL API · HTTP</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="card" x="64" y="344" width="312" height="124" rx="16"/>
    <rect x="82" y="362" width="52" height="52" rx="14" fill="#423417"/>
    <circle cx="108" cy="388" r="8" stroke="#FFC857" stroke-width="2.5"/>
    <path d="M108 373v-4m0 38v-4m15-15h4m-38 0h4m25-10 3-3m-27 27-3 3m0-30 3 3m27 27 3-3" stroke="#FFC857" stroke-width="2.2" stroke-linecap="round"/>
    <path d="m88 402 13-7 8 5 13-9" stroke="#FFE09A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="card-title" x="150" y="380">SMA inverter</text>
    <text class="card-detail" x="150" y="401">Solar power in watts</text>
    <rect x="150" y="418" width="142" height="24" rx="12" fill="#3C321B"/>
    <text class="badge" x="163" y="434" fill="#FFD978">MODBUS TCP · 502</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="card" x="64" y="525" width="312" height="124" rx="16"/>
    <rect x="82" y="543" width="52" height="52" rx="14" fill="#173B34"/>
    <rect x="99" y="553" width="18" height="34" rx="5" stroke="#55D6A2" stroke-width="2.4"/>
    <path d="M104 559h8m-8 20h8m-4-10v6" stroke="#55D6A2" stroke-width="2" stroke-linecap="round"/>
    <path d="M122 567h4v11h-4" stroke="#55D6A2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="card-title" x="150" y="561">Alfen charger</text>
    <text class="card-detail" x="150" y="582">Vehicle charging power</text>
    <rect x="150" y="599" width="139" height="24" rx="12" fill="#19382F"/>
    <text class="badge" x="163" y="615" fill="#7BE3BB">LOCAL API · HTTPS</text>
  </g>

  <!-- Central Raspberry Pi -->
  <g filter="url(#shadow)">
    <rect x="520" y="207" width="400" height="442" rx="22" fill="url(#pi)" stroke="#4B6586" stroke-width="1.7"/>
    <rect x="540" y="227" width="360" height="48" rx="12" fill="#263951"/>
    <circle cx="562" cy="251" r="6" fill="#55D6A2"/>
    <text x="579" y="257" fill="#F5F8FD" font-size="20" font-weight="700">Raspberry Pi</text>
    <text x="869" y="256" fill="#A9BCD3" font-size="11" text-anchor="end">CENTRAL HUB</text>

    <!-- Processor / Python icon -->
    <rect x="552" y="299" width="74" height="74" rx="17" fill="#18283B" stroke="#3A536F"/>
    <rect x="570" y="317" width="38" height="38" rx="8" fill="#1F6B57"/>
    <path d="M582 327c0-4 3-6 7-6h7v8h-9v5h-5v-7Zm19 18c0 4-3 6-7 6h-7v-8h9v-5h5v7Z" fill="#C7F5DE"/>
    <path d="M577 325h-4m4 10h-4m39-10h-4m4 10h-4m-27 9h-4m4 7h-4m39-7h-4m4 7h-4M581 313v-4m10 4v-4m10 4v-4m-20 54v-4m10 4v-4m10 4v-4" stroke="#86A0BC" stroke-width="1.6" stroke-linecap="round"/>
    <text x="643" y="322" fill="#F1F5FA" font-size="16" font-weight="650">Python energy.py</text>
    <text class="card-detail" x="643" y="344">Reads devices and combines</text>
    <text class="card-detail" x="643" y="363">their readings into an energy balance.</text>

    <path d="M552 394H888" stroke="#34475F"/>
    <circle cx="563" cy="424" r="5" fill="#57A6FF"/>
    <text x="580" y="429" fill="#DFE8F3" font-size="14" font-weight="600">Web server + JSON API</text>
    <text class="card-detail" x="580" y="449">Live charts over HTTP on port 80</text>
    <circle cx="563" cy="481" r="5" fill="#FFC857"/>
    <text x="580" y="486" fill="#DFE8F3" font-size="14" font-weight="600">Local storage</text>
    <text class="card-detail" x="580" y="506">Power history + BMW battery events</text>
    <rect x="552" y="527" width="336" height="54" rx="11" fill="#30252A" stroke="#704A45"/>
    <circle cx="573" cy="548" r="8" fill="#4B302F"/>
    <path d="M569 548h8m-4-4v8m-3 8h6" stroke="#FF9678" stroke-width="1.7" stroke-linecap="round"/>
    <text x="592" y="547" fill="#FFE5DC" font-size="13" font-weight="650">EV charging control</text>
    <text x="592" y="566" fill="#D6B6AD" font-size="11">P1 + charger feedback · solar surplus · grid limit</text>
    <rect x="552" y="594" width="336" height="42" rx="11" fill="#152235" stroke="#334A65"/>
    <path d="M569 607h15v15h-15z" stroke="#83A0BE" stroke-width="1.6"/>
    <path d="M573 611h7m-7 4h7m-7 4h5" stroke="#83A0BE" stroke-width="1.4" stroke-linecap="round"/>
    <text x="596" y="612" fill="#C7D3E2" font-size="11" font-weight="600">ENERGY MONITOR SERVICE</text>
    <text x="596" y="627" fill="#879AB1" font-size="10">runs continuously on the Pi</text>
  </g>

  <!-- BMW cloud integration -->
  <g filter="url(#shadow)">
    <rect class="card" x="1005" y="155" width="371" height="132" rx="16"/>
    <rect x="1023" y="174" width="52" height="52" rx="14" fill="#302548"/>
    <path d="M1040 204h20l-2-9h-16l-2 9Z" stroke="#B49AFF" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M1044 195v-5h12v5m-17 14h22" stroke="#B49AFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1045" cy="209" r="2.5" fill="#B49AFF"/><circle cx="1058" cy="209" r="2.5" fill="#B49AFF"/>
    <text class="card-title" x="1091" y="193">BMW CarData</text>
    <text class="card-detail" x="1091" y="214">Battery level when the car reports</text>
    <rect x="1091" y="230" width="145" height="24" rx="12" fill="#2B2340"/>
    <text class="badge" x="1104" y="246" fill="#C9B6FF">BMW CLOUD · MQTT/TLS</text>
    <text class="small" x="1023" y="273">Vehicle data arrives through BMW's cloud</text>
  </g>

  <!-- Browser dashboard -->
  <g filter="url(#shadow)">
    <rect class="card" x="1005" y="424" width="371" height="148" rx="16"/>
    <rect x="1023" y="443" width="52" height="52" rx="14" fill="#173354"/>
    <rect x="1032" y="452" width="34" height="25" rx="4" stroke="#57A6FF" stroke-width="2"/>
    <path d="M1029 482h40m-23-5v5m7-5v5" stroke="#57A6FF" stroke-width="2" stroke-linecap="round"/>
    <path d="M1037 471v-6l5 3 5-7 5 4 5-6" stroke="#83BEFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="card-title" x="1091" y="462">Browser dashboard</text>
    <text class="card-detail" x="1091" y="483">Phone · tablet · computer</text>
    <rect x="1091" y="501" width="175" height="24" rx="12" fill="#17304B"/>
    <text class="badge" x="1104" y="517" fill="#83BEFF">HOSTED ON THE RASPBERRY PI</text>
    <text class="small" x="1023" y="550">Open http://energie.local or the Pi's IP address</text>
  </g>

  <!-- Flow labels -->
  <rect x="389" y="184" width="104" height="24" rx="12" fill="#13243A" stroke="#284666"/>
  <text class="label" x="441" y="200" text-anchor="middle" fill="#93C8FF">power + water</text>
  <rect x="391" y="387" width="104" height="24" rx="12" fill="#302817" stroke="#56451F"/>
  <text class="label" x="443" y="403" text-anchor="middle" fill="#FFE09A">solar power</text>
  <rect x="397" y="568" width="90" height="24" rx="12" fill="#142D29" stroke="#295448"/>
  <text class="label" x="442" y="584" text-anchor="middle" fill="#8CE9C5">charging power</text>
  <rect x="400" y="661" width="107" height="24" rx="12" fill="#342522" stroke="#704A45"/>
  <text class="label" x="453" y="677" text-anchor="middle" fill="#FFC0AA">current limit</text>
  <rect x="926" y="188" width="70" height="24" rx="12" fill="#241E35" stroke="#483A65"/>
  <text class="label" x="961" y="204" text-anchor="middle" fill="#C9B6FF">BMW data</text>
  <rect x="928" y="515" width="69" height="24" rx="12" fill="#13243A" stroke="#284666"/>
  <text class="label" x="962" y="531" text-anchor="middle" fill="#93C8FF">web page</text>

  <!-- Legend -->
  <path d="M65 720H1375" stroke="#2B3A4F"/>
  <text x="66" y="758" fill="#D9E3EF" font-size="12" font-weight="650">DATA FLOWS</text>
  <path d="M168 754h38" stroke="#57A6FF" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text class="small" x="216" y="758">local reading / dashboard</text>
  <path d="M410 754h38" stroke="#FFC857" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <text class="small" x="458" y="758">solar power</text>
  <path d="M589 754h38" stroke="#55D6A2" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text class="small" x="637" y="758">charger</text>
  <path d="M747 754h38" stroke="#B49AFF" stroke-width="2.5" marker-end="url(#arrow-violet)"/>
  <text class="small" x="795" y="758">BMW CarData over the internet</text>
  <path d="M1050 754h38" stroke="#FF9678" stroke-width="2.5" marker-end="url(#arrow-control)"/>
  <text class="small" x="1098" y="758">EV charger control</text>
  <text x="1375" y="758" text-anchor="end" fill="#73859C" font-size="11">Energy Monitor · Raspberry Pi</text>
</svg>
