<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Energie</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Energie">
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#14171c;--mute:#667085;--line:#e4e7ec;
--grid-in:#e5484d;--grid-out:#2f9e6b;--solar:#e69500;--charger:#2f7de1;--home:#7c5cdb;--water:#0d9aa8;--soc:#c2389a;
--phase1:#0072b2;--phase2:#d55e00;--phase3:#009e73}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--fg:#eef0f3;--mute:#8b93a1;--line:#272c36;
--grid-in:#ff6369;--grid-out:#3dd68c;--solar:#ffc53d;--charger:#5b9dff;--home:#a78bfa;--water:#2dd4e0;--soc:#ff7ac6;
--phase1:#56b4e9;--phase2:#e69f00;--phase3:#00c996}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 14px 0;max-width:1200px;margin:auto}
h1{font-size:18px;margin:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mute)}
.dot.on{background:var(--grid-out)}.dot.off{background:var(--grid-in)}
#warn{color:var(--grid-in);font-size:13px;flex:1}
nav{display:flex;gap:4px}
#range{margin-left:auto}
nav button{font:inherit;font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);cursor:pointer}
nav button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
main{display:grid;gap:12px;padding:12px 14px 20px;max-width:1200px;margin:auto;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr))}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px 6px}
section.wide{grid-column:1/-1}
section.phases{grid-column:1}
#charger-polling{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
#charger-polling button{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);cursor:pointer}
#charger-polling button:disabled{opacity:.6;cursor:wait}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.phase-legend{display:flex;flex-wrap:wrap;gap:3px 12px;color:var(--mute);font-size:11px;padding-top:2px}
.phase-legend:empty{display:none}
.phase-legend span{white-space:nowrap}
.name{font-weight:600}.sub{color:var(--mute);font-size:12px;flex:1;min-width:140px}
.sub b{font-weight:400;font-size:11px}
.val{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums}
#peak .bar{height:8px;border-radius:4px;background:var(--line);margin:10px 0 6px;overflow:hidden}
#peak .bar i{display:block;height:100%;width:0;border-radius:4px;background:var(--charger);transition:width .6s,background .3s}
#peak .bar i.hot{background:var(--solar)}#peak .bar i.over{background:var(--grid-in)}
#peak .note{color:var(--mute);font-size:12px;padding-bottom:6px}
canvas{display:block;width:100%;height:170px;touch-action:pan-y}
.summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding:8px 0 6px}
.summary-title{grid-column:1/-1;color:var(--mute);font-size:12px}
.summary-item{min-width:0;padding:7px 9px;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.summary-label{display:block;overflow:hidden;color:var(--mute);font-size:11px;text-overflow:ellipsis;white-space:nowrap}
.summary-value{display:block;margin-top:2px;font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.summary-item.home .summary-value{color:var(--home)}
.summary-item.charger .summary-value{color:var(--charger)}
.summary-item.import .summary-value{color:var(--grid-in)}
.summary-item.export .summary-value{color:var(--grid-out)}
.summary-item.solar .summary-value,.summary-item.self .summary-value{color:var(--solar)}
.summary-bar{height:3px;margin-top:5px;overflow:hidden;border-radius:2px;background:var(--line)}
.summary-bar i{display:block;width:0;height:100%;border-radius:2px;background:var(--solar)}
.summary-note{grid-column:1/-1;color:var(--mute);font-size:11px}
@media(max-width:700px){.summary{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.summary-item{padding:6px 7px}.summary-value{font-size:15px}}
</style>
</head>
<body>
<header>
  <h1 id="app-title">Energie</h1><span id="dot" class="dot" title="verbinding"></span><span id="warn"></span>
  <nav id="range" aria-label="Time range"></nav>
</header>
<main id="charts"></main>
<script>
"use strict";
const GAP = 35;                      // seconden zonder data waarna de lijn onderbroken wordt
const MAX_AGE_UI = 5;
const TEXT = {
  nl: {
    connection:'verbinding', balance:'Energiebalans', grid:'Net', solar:'Zon', carBattery:'Auto batterij', water:'Water', peak:'Maandpiek',
    gridNote:'+ afname · − injectie', solarNote:'productie',
    pauseCharger:'Pauzeer uitlezen Alfen', resumeCharger:'Hervat uitlezen Alfen',
    chargerPollingActive:'Uitlezen actief. Pauzeren maakt de verbinding vrij voor MyEve; laden verandert niet.',
    chargerPollingPaused:'Uitlezen gepauzeerd. Laden blijft ongewijzigd.',
    chargerPollingError:'Kon uitlezen niet wijzigen: {0}',
    phases:'Netverbruik per fase', phasesNote:'+ afname · − injectie', phaseL1:'L1', phaseL2:'L2', phaseL3:'L3', phaseThree:'3-fase',
    house:'huis', carCharging:'Auto laden', gridImport:'Netafname', gridExport:'Injectie', solarGenerated:'Zon opgewekt', selfConsumption:'Zelfverbruik zon',
    summaryTitle:'Verbruik en opwekking · laatste {0}', summaryNote:'Energie over de geselecteerde periode · ≈ geeft onvolledige meetdekking aan',
    noData:'geen data', noSources:'Geen data: {0}', noUsage:'geen verbruik te berekenen', missing:'ontbreekt', conjunction:' en ',
    homeAndCharger:'huis + laadpaal {0} (laadpaal onbekend)', powerUse:'verbruik', fromGrid:'afname van het net', toGrid:'injectie op het net',
    socWait:'wacht op melding van de auto', updated:'bijgewerkt {0}', ago:'{0} geleden', days:'{0} d', hours:'{0} u',
    distanceFrom:'{0} km van {1}', location:'locatie {0}', lastReport:'laatste melding {0}',
    waterWait:'wacht op eerste meting', measurementEvery:'laatste {0} · meting elke {1}, laatst {2} · per {3}',
    waterNotReported:'nog niet gemeld', perBucket:'per {0}', waitingMeasurement:'wacht op meting',
    peakHighest:'hoogste kwartier deze maand', peakAt:'om {0}', quarterAverage:'Dit kwartier gemiddeld {0}', ofPeak:'{0} % van je piek', newPeak:'nieuwe piek!',
    ranges:{900:'15 min',3600:'1 uur',21600:'6 uur',86400:'24 uur'},
    shortRanges:{900:'15 min',3600:'1 uur',21600:'6 uur',86400:'24 uur'},
    buckets:{900:'1 min',3600:'2 min',21600:'10 min',86400:'30 min'},
    rangeButtons:{900:'15m',3600:'1u',21600:'6u',86400:'24u'}
  },
  en: {
    connection:'connection', balance:'Energy balance', grid:'Grid', solar:'Solar', carBattery:'Car battery', water:'Water', peak:'Monthly peak',
    gridNote:'+ import · − export', solarNote:'production',
    pauseCharger:'Pause Alfen polling', resumeCharger:'Resume Alfen polling',
    chargerPollingActive:'Polling is active. Pausing frees the connection for MyEve; charging is unchanged.',
    chargerPollingPaused:'Polling is paused. Charging remains unchanged.',
    chargerPollingError:'Could not change polling: {0}',
    phases:'Grid power by phase', phasesNote:'+ import · − export', phaseL1:'L1', phaseL2:'L2', phaseL3:'L3', phaseThree:'3-phase',
    house:'home', carCharging:'Car charging', gridImport:'Grid import', gridExport:'Grid export', solarGenerated:'Solar generated', selfConsumption:'Solar self-use',
    summaryTitle:'Usage and generation · last {0}', summaryNote:'Energy for the selected period · ≈ indicates incomplete measurement coverage',
    noData:'no data', noSources:'No data: {0}', noUsage:'cannot calculate usage', missing:'missing', conjunction:' and ',
    homeAndCharger:'home + charger {0} (charger unknown)', powerUse:'usage', fromGrid:'grid import', toGrid:'grid export',
    socWait:'waiting for a report from the car', updated:'updated {0}', ago:'{0} ago', days:'{0} d', hours:'{0} h',
    distanceFrom:'{0} km from {1}', location:'location {0}', lastReport:'last report {0}',
    waterWait:'waiting for first reading', measurementEvery:'last {0} · reading every {1}, latest {2} · per {3}',
    waterNotReported:'not reported yet', perBucket:'per {0}', waitingMeasurement:'waiting for reading',
    peakHighest:'highest quarter-hour average this month', peakAt:'at {0}', quarterAverage:'Current quarter average {0}', ofPeak:'{0} % of peak', newPeak:'new peak!',
    ranges:{900:'15 min',3600:'1 hour',21600:'6 hours',86400:'24 hours'},
    shortRanges:{900:'15 min',3600:'1 hour',21600:'6 hours',86400:'24 hours'},
    buckets:{900:'1 min',3600:'2 min',21600:'10 min',86400:'30 min'},
    rangeButtons:{900:'15m',3600:'1h',21600:'6h',86400:'24h'}
  }
};
let language = 'nl';
const tr = (key, ...args) => {
  let s = TEXT[language][key];
  for (let i = 0; i < args.length; i++) s = s.replace(`{${i}}`, args[i]);
  return s;
};
// V-indexen: 0 net, 1 zon, 2 laadpaal, 3 huis, 4 water, 5-7 netvermogen per fase
const M = [
  {k:'balance', nameKey:'balance', stack:true, balance:true, signed:true, wide:true, h:270},
  {k:'grid',  i:0, nameKey:'grid',  noteKey:'gridNote', signed:true},
  {k:'solar', i:1, nameKey:'solar',  noteKey:'solarNote'},
  {k:'phases', i:[5,6,7], nameKey:'phases', noteKey:'phasesNote', phases:true, signed:true},
  {k:'soc', nameKey:'carBattery', soc:true, hidden:true, tick: v => v + '%'},
  {k:'water', i:4, nameKey:'water', water:true, tick: v => String(+v.toFixed(1)).replace('.', language === 'nl' ? ',' : '.')},
];
const SRC_KEY = {grid:'grid', solar:'solar', charger:'chargerSource', water:'water'};
TEXT.nl.chargerSource = 'laadpaal'; TEXT.en.chargerSource = 'charger';
const RANGES = [900,3600,21600,86400];
let T = [], V = Array.from({length:8}, () => []), since = null, now = Date.now()/1000, span = 900, cursor = null, wAt = null, wInt = 300, hasCharger = false, hasGrid = false, hasSolar = false, S = [], socOn = false, peak = null, carDistance = null, phaseAppliances = {}, chargerPolling = {available:false, paused:false};

// ---- DOM
const main = document.getElementById('charts');
for (const m of M) {
  m.name = tr(m.nameKey);
  const s = document.createElement('section');
  if (m.wide) s.className = 'wide';
  if (m.phases) s.classList.add('phases');
  s.innerHTML = `<div class="head"><span class="name">${m.name}</span><span class="sub"></span><span class="val">–</span></div><canvas></canvas>`;
  main.appendChild(s); m.sec = s;
  m.cv = s.querySelector('canvas'); m.ctx = m.cv.getContext('2d');
  if (m.phases) {
    m.legend = document.createElement('div');
    m.legend.className = 'phase-legend';
    s.insertBefore(m.legend, m.cv);
  }
  if (m.h) m.cv.style.height = m.h + 'px';
  m.val = s.querySelector('.val'); m.sub = s.querySelector('.sub');
  if (m.phases) m.val.style.display = 'none';
  if (m.balance) {
    const summary = document.createElement('div');
    summary.className = 'summary';
    summary.innerHTML = `<span class="summary-title"></span>
      <div class="summary-item home"><span class="summary-label" data-label="house"></span><span class="summary-value">–</span></div>
      <div class="summary-item charger"><span class="summary-label" data-label="carCharging"></span><span class="summary-value">–</span></div>
      <div class="summary-item import"><span class="summary-label" data-label="gridImport"></span><span class="summary-value">–</span></div>
      <div class="summary-item export"><span class="summary-label" data-label="gridExport"></span><span class="summary-value">–</span></div>
      <div class="summary-item solar"><span class="summary-label" data-label="solarGenerated"></span><span class="summary-value">–</span></div>
      <div class="summary-item self"><span class="summary-label" data-label="selfConsumption"></span><span class="summary-value">–</span><div class="summary-bar"><i></i></div></div>
      <span class="summary-note" data-label="summaryNote"></span>`;
    s.appendChild(summary);
    m.summary = summary;
  }
  const move = e => { const r = m.cv.getBoundingClientRect(); cursor = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); render(); };
  const leave = () => { cursor = null; render(); };
  m.cv.addEventListener('pointermove', move);
  m.cv.addEventListener('pointerdown', move);
  for (const ev of ['pointerleave','pointerup','pointercancel']) m.cv.addEventListener(ev, leave);
}
const pk = document.createElement('section');
pk.className = 'wide'; pk.id = 'peak'; pk.style.display = 'none';
pk.innerHTML = `<div class="head"><span class="name" data-label="peak"></span><span class="sub"></span><span class="val">–</span></div><div class="bar"><i></i></div><div class="note"></div>`;
main.appendChild(pk);
const chargerControl = document.createElement('section');
chargerControl.className = 'wide'; chargerControl.id = 'charger-polling'; chargerControl.style.display = 'none';
chargerControl.innerHTML = '<button type="button"></button><span class="sub"></span>';
main.appendChild(chargerControl);
const chargerButton = chargerControl.querySelector('button');
const chargerNote = chargerControl.querySelector('.sub');
function setChargerPolling(state) {
  chargerPolling = state || {available:false, paused:false};
  chargerControl.style.display = chargerPolling.available ? '' : 'none';
  chargerButton.textContent = tr(chargerPolling.paused ? 'resumeCharger' : 'pauseCharger');
  chargerButton.setAttribute('aria-pressed', String(chargerPolling.paused));
  chargerNote.textContent = tr(chargerPolling.paused ? 'chargerPollingPaused' : 'chargerPollingActive');
}
chargerButton.addEventListener('click', async () => {
  chargerButton.disabled = true;
  try {
    const r = await fetch('/api/charger-polling', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({paused:!chargerPolling.paused})
    });
    if (!r.ok) throw new Error(r.status);
    setChargerPolling(await r.json());
  } catch (e) {
    chargerNote.textContent = tr('chargerPollingError', e.message || e);
  } finally {
    chargerButton.disabled = false;
  }
});
const nav = document.getElementById('range');
for (const secs of RANGES) {
  const b = document.createElement('button'); b.dataset.seconds = secs;
  b.className = secs === span ? 'on' : '';
  b.onclick = () => { span = secs; for (const x of nav.children) x.className = x === b ? 'on' : ''; render(); };
  nav.appendChild(b);
}
function setLanguage(code) {
  language = code;
  document.documentElement.lang = code;
  document.title = code === 'nl' ? 'Energie' : 'Energy';
  document.getElementById('app-title').textContent = document.title;
  document.querySelector('meta[name="apple-mobile-web-app-title"]').content = document.title;
  document.getElementById('dot').title = tr('connection');
  for (const m of M) {
    m.name = tr(m.nameKey);
    if (m.noteKey) m.note = tr(m.noteKey);
    m.sec.querySelector('.name').textContent = m.name;
  }
  for (const el of document.querySelectorAll('[data-label]')) el.textContent = tr(el.dataset.label);
  for (const b of nav.children) b.textContent = TEXT[language].rangeButtons[b.dataset.seconds];
  setChargerPolling(chargerPolling);
  renderPhaseLegend();
  render();
}

// ---- data
async function getJSON(url) {
  const r = await fetch(url, {cache:'no-store'});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function loadHistory() {
  const d = await getJSON('/api/history');
  T = d.t; V = [d.grid, d.solar, d.charger, d.home, d.water || [], d.phase_l1 || [], d.phase_l2 || [], d.phase_l3 || []]; since = d.until; now = d.now; wAt = d.water_at; wInt = d.water_interval || 300; S = d.soc || []; extras(d); setSrc(d.src, d.three_phase, d.appliances); setChargerPolling(d.charger_polling);
  setLanguage(d.language === 'en' ? 'en' : 'nl');
}
function extras(d) {
  socOn = !!d.soc_on; peak = d.peak || null;
  carDistance = d.car_distance || null;
  const l = d.soc_last;
  if (l && (!S.length || l[0] > S[S.length - 1][0])) S.push(l);
}
function setSrc(src, threePhase, appliances) {
  for (const m of M) if (m.soc) { m.hidden = !socOn; m.sec.style.display = m.hidden ? 'none' : ''; }
  hasCharger = 'charger' in src; hasGrid = 'grid' in src; hasSolar = 'solar' in src;
  phaseAppliances = appliances || {};
  for (const m of M) if (m.phases) { m.hidden = !hasGrid || !threePhase; m.sec.style.display = m.hidden ? 'none' : ''; }
  renderPhaseLegend();
  for (const m of M) if (m.k === 'water') { m.hidden = !('water' in src); m.sec.style.display = m.hidden ? 'none' : ''; }
  const bad = Object.keys(src).filter(k => !src[k]).map(k => tr(SRC_KEY[k] || k));
  document.getElementById('warn').textContent = bad.length ? tr('noSources', bad.join(', ')) : '';
}
function renderPhaseLegend() {
  const m = M.find(x => x.phases);
  if (!m?.legend) return;
  const colors = {l1:'--phase1', l2:'--phase2', l3:'--phase3', '3phase':'--home'};
  m.legend.replaceChildren();
  for (const key of ['l1', 'l2', 'l3', '3phase']) {
    const names = phaseAppliances[key]?.trim();
    if (!names) continue;
    const item = document.createElement('span');
    item.style.color = `var(${colors[key]})`;
    item.textContent = '● ';
    const label = key === '3phase' ? tr('phaseThree') : key.toUpperCase();
    item.append(document.createTextNode(`${label}: ${names}`));
    m.legend.appendChild(item);
  }
}
function trim() {
  const cutoff = now - 86400; let n = 0;
  while (n < T.length && T[n] < cutoff) n++;
  if (n) { T.splice(0, n); for (const v of V) v.splice(0, n); }
  while (S.length > 1 && S[1][0] <= cutoff) S.shift();   // houd 1 oudere melding om de lijn voort te zetten
}
async function tick() {
  const t0 = performance.now(), dot = document.getElementById('dot');
  try {
    if (since === null) await loadHistory();
    else {
      const d = await getJSON('/api/live?since=' + since);
      if (d.reload) await loadHistory();
      else {
        for (const s of d.samples) { T.push(s[0]); for (let j = 0; j < 8; j++) V[j].push(s[j+1]); since = s[0]; }
        now = d.now; wAt = d.water_at; wInt = d.water_interval || wInt; extras(d); setSrc(d.src, d.three_phase, d.appliances); setChargerPolling(d.charger_polling);
      }
    }
    trim(); dot.className = 'dot on'; render();
  } catch (e) { dot.className = 'dot off'; }
  setTimeout(tick, Math.max(0, 1000 - (performance.now() - t0)));
}

// ---- helpers
const hexA = (c, a) => { const n = parseInt(c.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };
const lb = (a, x) => { let lo = 0, hi = a.length; while (lo < hi) { const m = (lo+hi) >> 1; if (a[m] < x) lo = m+1; else hi = m; } return lo; };
const decimal = (x, d) => new Intl.NumberFormat(language === 'nl' ? 'nl-BE' : 'en-GB', {minimumFractionDigits:d, maximumFractionDigits:d}).format(x);
const fmt = v => v == null ? '–' : Math.abs(v) >= 1000 ? decimal(v/1000, 2) + ' kW' : Math.round(v) + ' W';
const fmtTick = v => Math.abs(v) >= 1000 ? decimal(v/1000, 1) + 'k' : String(Math.round(v));
const niceStep = r => { const p = Math.pow(10, Math.floor(Math.log10(r))), f = r / p; return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * p; };
const locale = () => language === 'nl' ? 'nl-BE' : 'en-GB';
const hhmm = t => new Date(t*1000).toLocaleTimeString(locale(), {hour:'2-digit', minute:'2-digit'});
const stamp = t => new Date(t*1000).toLocaleString(locale(), {weekday:'short', hour:'2-digit', minute:'2-digit', second:'2-digit'});
const fmtL = l => l == null ? '–' : l >= 1000 ? decimal(l / 1000, 2) + ' m³' : (l < 10 ? decimal(l, 1) : Math.round(l)) + ' L';
const BUCKET = {900:60, 3600:120, 21600:600, 86400:1800};         // seconden per punt van de golf
function integrate(indexes, start, end, transform = x => x) {
  const energy = indexes.map(() => 0);
  let seconds = 0;
  for (let i = Math.max(0, lb(T, start) - 1); i < T.length && T[i] < end; i++) {
    const t = T[i], next = i + 1 < T.length ? T[i + 1] : end;
    const a = Math.max(start, t), b = Math.min(end, t + Math.min(next - t, GAP));
    if (b <= a || indexes.some(j => V[j][i] == null)) continue;
    const duration = b - a;
    for (let j = 0; j < indexes.length; j++) energy[j] += transform(V[indexes[j]][i], j) * duration / 3600000;
    seconds += duration;
  }
  return {energy, seconds};
}
function renderSummary() {
  const m = M.find(x => x.balance), el = m.summary, start = now - span;
  el.querySelector('.summary-title').textContent = tr('summaryTitle', TEXT[language].shortRanges[span]);
  const house = hasCharger ? integrate([3, 2], start, now) : integrate([3], start, now);
  const charger = hasCharger ? house.energy[1] : 0;
  const houseEnergy = house.energy[0];
  const houseCoverage = house.seconds;
  const grid = integrate([0], start, now, (v, i) => Math.max(0, v));
  const exported = integrate([0], start, now, (v, i) => Math.max(0, -v));
  const solar = integrate([1], start, now);
  const paired = integrate([0, 1], start, now, (v, i) => i === 0 ? Math.max(0, -v) : v);
  const generated = paired.energy[1], injected = paired.energy[0];
  const selfUse = generated > 0
    ? Math.max(0, Math.min(100, (generated - injected) / generated * 100))
    : null;
  const energyText = (kWh, covered) => {
    if (covered <= 0) return '–';
    const value = kWh;
    return (covered < span * .99 ? '≈' : '') + (value < 10 ? decimal(value, 2) : decimal(value, 1)) + ' kWh';
  };
  const values = el.querySelectorAll('.summary-value');
  values[0].textContent = energyText(houseEnergy, houseCoverage);
  values[1].textContent = hasCharger ? energyText(charger, houseCoverage) : decimal(0, 2) + ' kWh';
  values[2].textContent = energyText(grid.energy[0], grid.seconds);
  values[3].textContent = energyText(exported.energy[0], exported.seconds);
  values[4].textContent = energyText(solar.energy[0], solar.seconds);
  values[5].textContent = selfUse == null ? '–' : (paired.seconds < span * .99 ? '≈' : '') + Math.round(selfUse) + ' %';
  el.querySelector('.summary-bar i').style.width = (selfUse == null ? 0 : selfUse) + '%';
}
// De watermeter meldt zich maar om de wInt seconden. Het verbruik van zo'n melding is
// verdeeld over het interval ervoor; na de laatste melding is het verbruik nog onbekend.
function waterBuckets() {
  const size = BUCKET[span], I = wInt, t0 = now - span, ys = V[4];
  const out = {size, total: null, wat: null, pts: [], byB: new Map()};
  if (wAt == null) return out;
  const raw = new Map(); let wat = wAt, total = 0;
  for (let i = lb(T, Math.floor(t0 / size) * size); i < T.length; i++) {
    const v = ys[i]; if (!(v > 0)) continue;
    const t = T[i], a = t - I; if (t > wat) wat = t;
    for (let b = Math.floor(a / size); b <= Math.floor(t / size); b++) {
      const ov = Math.min(t, (b + 1) * size) - Math.max(a, b * size);
      if (ov > 0) raw.set(b, (raw.get(b) || 0) + v * ov / I);
    }
    total += v * Math.max(0, t - Math.max(a, t0)) / I;
  }
  for (let b = Math.floor(t0 / size); b * size < wat; b++) {
    const bs = b * size, end = Math.min(bs + size, wat), cov = end - bs;
    if (cov < 1) continue;
    const L = (raw.get(b) || 0) / 1000 * size / cov;   // laatste tijdvak is maar deels gemeld: omgerekend naar volle lengte
    out.pts.push([(bs + end) / 2, L, b]); out.byB.set(b, L);
  }
  out.total = total; out.wat = wat;
  return out;
}
// Verbruik op punt i: huis (onderaan) + laadpaal (erbovenop). Zonder laadpaaldata blijft het totaal
// bekend (= net + zon, ook voor oudere opgeslagen punten) maar is de verdeling onbekend (unk).
function usageAt(i) {
  const h = V[3][i], c = V[2][i];
  if (h != null) return hasCharger && c == null ? {total: h, home: null, charger: null, unk: true}
                                                : {total: h + (c ?? 0), home: h, charger: c ?? 0, unk: false};
  if (hasCharger && c == null && (hasGrid || hasSolar) && (!hasGrid || V[0][i] != null) && (!hasSolar || V[1][i] != null))
    return {total: Math.max(0, (V[0][i] ?? 0) + (V[1][i] ?? 0)), home: null, charger: null, unk: true};
  return null;
}
const stackLayers = () => {            // [huis, totaal met bekende verdeling, totaal zonder bekende verdeling]
  const n = T.length, hk = new Array(n), tk = new Array(n), tu = new Array(n), U = new Array(n);
  for (let i = 0; i < n; i++) {
    const u = U[i] = usageAt(i);
    hk[i] = u && !u.unk ? u.home : null;
    tk[i] = u && !u.unk ? u.total : null;
    tu[i] = u && u.unk ? u.total : null;
  }
  // Op elke overgang bekend <-> onbekend laat de grijze laag ook het aangrenzende bekende punt
  // meetekenen, zodat de twee lagen tegen elkaar aansluiten en er geen holletje tussen valt.
  for (let i = 0; i < n; i++) {
    const u = U[i];
    if (u && !u.unk && ((i > 0 && U[i-1] && U[i-1].unk) || (i < n - 1 && U[i+1] && U[i+1].unk))) tu[i] = u.total;
  }
  return [hk, tk, tu];
};

// ---- render
function renderPeak() {
  const el = document.getElementById('peak');
  if (!peak || peak.w == null) { el.style.display = 'none'; return; }
  el.style.display = '';
  let when = '';
  const mt = (peak.at || '').match(/^(\d+)-(\d+)-(\d+)T(\d+):(\d+)/);
  if (mt) {
    const d = new Date(+mt[1], mt[2] - 1, +mt[3], +mt[4], +mt[5]);
    when = ' · ' + d.toLocaleDateString(locale(), {weekday:'short', day:'numeric', month:'short'}) + ' ' + tr('peakAt', d.toLocaleTimeString(locale(), {hour:'2-digit', minute:'2-digit'}));
  }
  el.querySelector('.val').textContent = fmt(peak.w);
  el.querySelector('.sub').textContent = tr('peakHighest') + when;
  const bar = el.querySelector('.bar i'), note = el.querySelector('.note');
  if (peak.avg == null) { bar.style.width = '0'; bar.className = ''; note.textContent = ''; return; }
  const r = peak.w > 0 ? peak.avg / peak.w : 0;
  bar.style.width = Math.min(100, r * 100) + '%';
  bar.className = r > 1 ? 'over' : r >= .9 ? 'hot' : '';
  note.textContent = tr('quarterAverage', fmt(peak.avg)) + (peak.w > 0 ? ' (' + tr('ofPeak', Math.round(r * 100)) + ')' : '') + (r > 1 ? ' · ' + tr('newPeak') : '');
}
function render() {
  renderPeak();
  renderSummary();
  const css = getComputedStyle(document.documentElement);
  const col = n => css.getPropertyValue(n).trim();
  const ct = cursor == null ? null : now - span + cursor * span;
  const wb = waterBuckets();
  for (const m of M) {
    if (m.hidden) continue;
    draw(m, col, wb);
    let n = -1;                         // index van het getoonde punt
    if (ct == null) { n = T.length - 1; if (n >= 0 && T[n] < now - MAX_AGE_UI) n = -1; }
    else {
      n = lb(T, ct); if (n > 0 && (n === T.length || ct - T[n-1] < T[n] - ct)) n--;
      if (!(n >= 0 && n < T.length && Math.abs(T[n] - ct) <= GAP)) n = -1;
    }
    const when = ct == null ? '' : (n >= 0 ? stamp(T[n]) : hhmm(ct) + ' · ' + tr('noData'));
    if (m.soc) {
      const last = S.length ? S[S.length - 1] : null;
      if (ct == null) {
        m.val.textContent = last ? Math.round(last[1]) + ' %' : '–';
        const age = last ? now - last[0] : 0;
        const ageText = (seconds) => tr('ago', seconds >= 86400 ? tr('days', Math.round(seconds / 86400)) : tr('hours', Math.round(seconds / 3600)));
        const socSub = !last ? tr('socWait')
          : tr('updated', hhmm(last[0])) + (age > 3600 ? ' (' + ageText(age) + ')' : '');
        const distanceSub = carDistance ? tr('distanceFrom', decimal(carDistance.km, 1),
          carDistance.name.toLowerCase() === 'home' ? tr('house') : carDistance.name)
          + ' · ' + tr('location', hhmm(carDistance.at))
          + (now - carDistance.at > 3600 ? ' (' + ageText(now - carDistance.at) + ')' : '') : '';
        m.sub.textContent = [socSub, distanceSub].filter(Boolean).join(' · ');
      } else {
        const i = lb(S.map(e => e[0]), ct + 1) - 1;
        m.val.textContent = i < 0 ? '–' : Math.round(S[i][1]) + ' %';
        m.sub.textContent = i < 0 ? hhmm(ct) + ' · ' + tr('noData') : tr('lastReport', stamp(S[i][0]));
      }
    } else if (m.phases) {
      const colors = ['--phase1', '--phase2', '--phase3'];
      const labels = ['phaseL1', 'phaseL2', 'phaseL3'];
      const values = m.i.map(i => n < 0 ? null : V[i][n]);
      m.sub.innerHTML = (when ? when + ' · ' : '') +
        values.map((v, i) => `<b style="color:var(${colors[i]})">●</b> ${tr(labels[i])} ${fmt(v)}`).join(' · ') +
        ` · ${tr('phasesNote')}`;
    } else if (m.water) {
      if (wb.wat == null) { m.val.textContent = '–'; m.sub.textContent = tr('waterWait'); }
      else if (ct == null) {
        m.val.textContent = fmtL(wb.total / 1000);
        const intervalText = wInt % 60 ? wInt + ' s' : wInt / 60 + ' min';
        m.sub.textContent = tr('measurementEvery', TEXT[language].ranges[span], intervalText, hhmm(wb.wat), TEXT[language].buckets[span]);
      } else {
        const b = Math.floor(ct / wb.size), L = wb.byB.get(b);
        m.val.textContent = L == null ? '–' : fmtL(L);
        m.sub.textContent = stamp(b * wb.size) + (L == null ? ' · ' + tr('waterNotReported') : ' · ' + tr('perBucket', TEXT[language].buckets[span]));
      }
    } else if (m.balance || m.stack) {
      const u = n < 0 ? null : usageAt(n), dot = v => `<b style="color:var(${v})">●</b>`;
      const miss = n < 0 ? [] : [[hasGrid, V[0][n], tr('grid')], [hasSolar, V[1][n], tr('solar')]].filter(x => x[0] && x[1] == null).map(x => x[2]);
      const split = !u ? (n < 0 ? tr('noData') : tr('noUsage') + (miss.length ? ': ' + miss.join(tr('conjunction')) + ' ' + tr('missing') : ''))
        : u.unk ? `${dot('--mute')} ${tr('homeAndCharger', fmt(u.total))}`
        : `${dot('--home')} ${tr('house')} ${fmt(u.home)} · ${dot('--charger')} ${tr('carCharging')} ${fmt(u.charger)}`;
      if (m.balance) {
        const g = n < 0 ? null : V[0][n], z = n < 0 ? null : V[1][n];
        m.val.innerHTML = `<span style="font-size:12px;font-weight:400;color:var(--mute)">${tr('powerUse')} </span>${fmt(u ? u.total : null)}`;
        m.sub.innerHTML = (when ? when + ' · ' : '') + split + ` · ${dot('--solar')} ${tr('solar')} ${fmt(z)} · ${dot('--grid-in')} ${tr('grid')} ${fmt(g)}`;
      } else {
        m.val.textContent = fmt(u ? u.total : null);
        m.sub.innerHTML = (when ? when + ' · ' : '') + split;
      }
    } else {
      const v = n < 0 ? null : V[m.i][n];
      let sub = when || m.note;
      if (!when && m.signed && v != null && Math.abs(v) >= 1) sub = v > 0 ? tr('fromGrid') : tr('toGrid');
      m.val.textContent = (m.fmtv || fmt)(v); m.sub.textContent = sub;
    }
  }
}

// gemiddelde per pixelkolom; null = lijn onderbreken
function columns(ys, t0, W) {
  const pts = []; let cx = -1, sum = 0, n = 0, tsum = 0, lastT = null;
  const flush = () => { if (n) pts.push([(tsum/n - t0) / span * W, sum/n]); sum = n = tsum = 0; };
  for (let i = lb(T, t0); i < T.length; i++) {
    const t = T[i], v = ys[i];
    if (lastT !== null && t - lastT > GAP) { flush(); pts.push(null); }
    lastT = t;
    if (v == null) { flush(); if (pts.length && pts[pts.length-1] !== null) pts.push(null); continue; }
    const c = Math.floor((t - t0) / span * W);
    if (c !== cx) { flush(); cx = c; }
    sum += v; n++; tsum += t;
  }
  flush();
  return pts;
}
function segments(pts) {
  const out = []; let s = [];
  for (const p of pts) { if (p) s.push(p); else { if (s.length) out.push(s); s = []; } }
  if (s.length) out.push(s);
  return out;
}

function draw(m, col, wb) {
  const cv = m.cv, ctx = m.ctx, dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== Math.round(W*dpr) || cv.height !== Math.round(H*dpr)) { cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  const t1 = now, t0 = now - span, padB = 16, ph = H - padB;

  let solarPts = [], gridPts = [], unkPts = [], phasePts = []; // extra lijnen in energiebalans en fasegrafiek
  let top = [], low = null;                  // top = zichtbare reeks (bij stapeling het totaal), low = onderste laag
  if (m.water || m.soc) { /* eigen tekening: zie onderaan */ }
  else if (m.stack) { const [h, tk, tu] = stackLayers(); low = columns(h, t0, W); top = columns(tk, t0, W); unkPts = columns(tu, t0, W); }
  else if (m.phases) phasePts = m.i.map(i => columns(V[i], t0, W));
  else top = columns(V[m.i], t0, W);
  if (m.balance) { solarPts = columns(V[1], t0, W); gridPts = columns(V[0], t0, W); }

  // y-bereik
  let lo = 0, hi = 0;
  if (m.water) { for (const p of wb.pts) hi = Math.max(hi, p[1]); }
  for (const p of top.concat(solarPts, gridPts, unkPts, ...phasePts)) if (p) { if (p[1] < lo) lo = p[1]; if (p[1] > hi) hi = p[1]; }
  if (!m.signed) lo = 0;
  const minR = m.water ? 1 : 100;
  if (hi - lo < minR) { hi = Math.max(hi, lo + minR); if (m.signed && lo === 0) lo = -Math.min(100, hi); }
  const pad = (hi - lo) * 0.08; hi += pad; if (m.signed && lo < 0) lo -= pad;
  if (m.soc) { lo = 0; hi = 104; }
  const Y = v => (hi - v) / (hi - lo) * ph, y0 = Y(0);

  // rasterlijnen + labels
  ctx.font = '10px system-ui,sans-serif'; ctx.lineWidth = 1;
  ctx.strokeStyle = col('--line'); ctx.fillStyle = col('--mute'); ctx.textBaseline = 'bottom'; ctx.textAlign = 'left';
  const step = niceStep((hi - lo) / 3);
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    const y = Math.round(Y(v)) + .5;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); ctx.fillText((m.tick || fmtTick)(v), 2, y - 1);
  }
  const tstep = span >= 86400 ? 14400 : span >= 21600 ? 3600 : span >= 3600 ? 600 : 120;
  const off = new Date(t0*1000).getTimezoneOffset() * 60;
  ctx.textBaseline = 'top'; ctx.textAlign = 'center';
  for (let t = Math.ceil((t0 - off) / tstep) * tstep + off; t <= t1; t += tstep) {
    const x = Math.round((t - t0) / span * W) + .5;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, ph); ctx.stroke();
    if (x > 14 && x < W - 14) ctx.fillText(hhmm(t), x, ph + 3);
  }

  // tekenen
  const trace = (seg, from) => { seg.forEach((p, i) => i ? ctx.lineTo(p[0], Y(p[1])) : ctx.moveTo(p[0], Y(p[1]))); };
  // base = segment waartegen gevuld wordt (onderliggende laag), anders de nullijn
  const paint = (seg, color, base, alpha) => {
    ctx.strokeStyle = ctx.fillStyle = color; ctx.lineWidth = 1.5; ctx.lineJoin = 'round';
    if (seg.length === 1) { ctx.beginPath(); ctx.arc(seg[0][0], Y(seg[0][1]), 1.5, 0, 6.3); ctx.fill(); return; }
    ctx.beginPath(); trace(seg); ctx.stroke();
    if (base) for (let i = base.length - 1; i >= 0; i--) ctx.lineTo(base[i][0], Y(base[i][1]));
    else { ctx.lineTo(seg[seg.length-1][0], y0); ctx.lineTo(seg[0][0], y0); }
    ctx.closePath(); ctx.globalAlpha = alpha; ctx.fill(); ctx.globalAlpha = 1;
  };
  const series = (color, clip) => {
    ctx.save();
    if (clip) { ctx.beginPath(); ctx.rect(0, clip[0], W, clip[1]); ctx.clip(); }
    for (const sg of segments(top)) paint(sg, color, null, .18);
    ctx.restore();
  };
  if (m.water) {                        // verbruik per tijdvak als vloeiende golf met zachte gloed
    if (wb.wat != null && wb.wat < t1) {  // na de laatste melding is het verbruik nog onbekend
      const x1 = Math.max(0, (wb.wat - t0) / span * W);
      ctx.fillStyle = hexA(col('--mute'), .12); ctx.fillRect(x1, 0, W - x1, ph);
      if (W - x1 > 110) { ctx.fillStyle = col('--mute'); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(tr('waitingMeasurement'), (x1 + W) / 2, ph / 2); }
    }
    const P = wb.pts.map(p => [(p[0] - t0) / span * W, Y(p[1])]), n = P.length;
    if (n > 1) {
      // monotone kubische interpolatie: glad, en nooit onder nul of boven de echte piek
      const hs = [], d = [], k = [];
      for (let i = 0; i < n - 1; i++) { hs.push(P[i+1][0] - P[i][0]); d.push((P[i+1][1] - P[i][1]) / hs[i]); }
      k[0] = d[0]; k[n-1] = d[n-2];
      for (let i = 1; i < n - 1; i++) k[i] = d[i-1] * d[i] <= 0 ? 0 : (d[i-1] + d[i]) / 2;
      for (let i = 0; i < n - 1; i++) {
        if (d[i] === 0) { k[i] = k[i+1] = 0; continue; }
        const a1 = k[i] / d[i], b1 = k[i+1] / d[i], q = a1 * a1 + b1 * b1;
        if (q > 9) { const t = 3 / Math.sqrt(q); k[i] = t * a1 * d[i]; k[i+1] = t * b1 * d[i]; }
      }
      const curve = () => {
        ctx.moveTo(P[0][0], P[0][1]);
        for (let i = 0; i < n - 1; i++)
          ctx.bezierCurveTo(P[i][0] + hs[i]/3, P[i][1] + k[i]*hs[i]/3, P[i+1][0] - hs[i]/3, P[i+1][1] - k[i+1]*hs[i]/3, P[i+1][0], P[i+1][1]);
      };
      const c = col('--water'), g = ctx.createLinearGradient(0, 0, 0, y0);
      g.addColorStop(0, hexA(c, .45)); g.addColorStop(1, hexA(c, .03));
      ctx.beginPath(); curve(); ctx.lineTo(P[n-1][0], y0); ctx.lineTo(P[0][0], y0); ctx.closePath();
      ctx.fillStyle = g; ctx.fill();
      ctx.beginPath(); curve();
      ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.lineJoin = 'round';
      ctx.shadowColor = c; ctx.shadowBlur = 8; ctx.stroke(); ctx.shadowBlur = 0;
    }
  } else if (m.soc) {                   // batterij: trapjes, de waarde blijft gelden tot de volgende melding
    let i0 = 0;
    while (i0 + 1 < S.length && S[i0 + 1][0] <= t0) i0++;
    if (S.length && S[i0][0] <= t1) {
      const X = t => (t - t0) / span * W, c = col('--soc');
      let y = S[i0][1];
      const P = [[S[i0][0] <= t0 ? 0 : X(S[i0][0]), y]];
      for (let i = i0 + 1; i < S.length; i++) { const x = X(S[i][0]); P.push([x, y], [x, S[i][1]]); y = S[i][1]; }
      const xl = P[P.length - 1][0], stale = t1 - S[S.length - 1][0] > 1200;
      const path = pts => pts.forEach((p, i) => i ? ctx.lineTo(p[0], Y(p[1])) : ctx.moveTo(p[0], Y(p[1])));
      ctx.beginPath(); path(P.concat([[W, y]])); ctx.lineTo(W, y0); ctx.lineTo(P[0][0], y0); ctx.closePath();
      const g = ctx.createLinearGradient(0, 0, 0, y0); g.addColorStop(0, hexA(c, .32)); g.addColorStop(1, hexA(c, .03));
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.lineJoin = 'round';
      ctx.beginPath(); path(P); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(xl, Y(y)); ctx.lineTo(W, Y(y));
      if (stale) ctx.setLineDash([5, 4]);
      ctx.stroke(); ctx.setLineDash([]);
    }
  } else if (m.stack) {
    const sT = segments(top), sL = segments(low);
    sT.forEach((sg, i) => paint(sg, col('--charger'), sL[i], .35));   // laadpaal = band tussen totaal en huis
    sL.forEach(sg => paint(sg, col('--home'), null, .35));            // huis = vanaf nul
    for (const sg of segments(unkPts)) paint(sg, col('--mute'), null, .35);   // totaal zonder bekende verdeling
    if (m.balance) {                                                  // zon en net als lijnen eroverheen
      for (const sg of segments(solarPts)) paint(sg, col('--solar'), null, 0);
      const gs = segments(gridPts);
      for (const [color, y, h] of [[col('--grid-in'), 0, y0], [col('--grid-out'), y0, H - y0]]) {
        ctx.save(); ctx.beginPath(); ctx.rect(0, y, W, h); ctx.clip();
        for (const sg of gs) paint(sg, color, null, 0);
        ctx.restore();
      }
    }
  } else if (m.phases) {
    for (const [i, points] of phasePts.entries())
      for (const sg of segments(points)) paint(sg, col(['--phase1', '--phase2', '--phase3'][i]), null, 0);
  } else if (m.signed) { series(col('--grid-in'), [0, y0]); series(col('--grid-out'), [y0, H - y0]); }
  else series(col('--' + m.k));

  // nullijn (net) en cursor
  if (m.signed) { ctx.strokeStyle = col('--mute'); ctx.beginPath(); ctx.moveTo(0, Math.round(y0)+.5); ctx.lineTo(W, Math.round(y0)+.5); ctx.stroke(); }
  if (cursor != null) { const x = Math.round(cursor * W) + .5; ctx.strokeStyle = col('--fg'); ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, ph); ctx.stroke(); }
}

window.addEventListener('resize', render);
setLanguage(language);
tick();
</script>
